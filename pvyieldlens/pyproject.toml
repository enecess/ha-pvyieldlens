[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pvyieldlens"
version = "0.1.0"
description = "Time-aligned photovoltaic performance monitoring for Home Assistant"
requires-python = ">=3.13"
dependencies = ["fastapi==0.162.0", "pydantic==2.14.1", "uvicorn==0.54.0", "httpx==0.28.1", "websockets==17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pvyieldlens = ["static/*.html", "static/*.css", "static/*.js", "static/locales/*.json"]
