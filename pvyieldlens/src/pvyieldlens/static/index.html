<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PVYieldLens</title>
  <link rel="stylesheet" href="static/style.css">
  <script type="module" src="static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">PVYieldLens</a>
    <nav id="data-navigation" aria-label="Data pages"><button class="nav-button active" id="live-tab" data-i18n="live_page">Live</button><button class="nav-button" id="history-tab" data-i18n="history">History</button><button class="nav-button" id="forecast-tab" data-i18n="forecast">Forecast</button></nav>
    <span class="connection-badge" id="connection-state" role="status">…</span>
    <label class="language-picker">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5h12M9 3v2M5 5c1 5 4 8 9 10M13 5c-1 5-4 8-9 10M13 21l4.5-11L22 21M15 17h5"/></svg>
      <select id="language-select" aria-label="Language"><option value="auto" data-i18n="auto">Auto</option><option value="en">English</option><option value="zh">中文</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pl">Polski</option><option value="it">Italiano</option></select>
    </label>
    <button id="settings-button" class="settings-button" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9.5 3-.7 2.4-2.3 1L4.2 6l-2 3.5L4 11v2l-1.8 1.5 2 3.5 2.3-.4 2.3 1 .7 2.4h5l.7-2.4 2.3-1 2.3.4 2-3.5L20 13v-2l1.8-1.5-2-3.5-2.3.4-2.3-1-.7-2.4Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </header>
  <main>
    <div id="banner" class="banner" role="status" hidden></div>
    <p id="draft-status" class="draft-status muted" data-i18n="unsaved" hidden></p>
    <section id="live-page">
      <section id="setup-empty" class="empty-state" hidden><h1 data-i18n="empty_setup">Connect your solar data</h1><p data-i18n="source_semantics"></p><button class="primary" id="open-settings" data-i18n="open_settings">Set up PVYieldLens</button></section>
      <div class="section-heading"><div><h1 data-i18n="realtime">Live data</h1><p class="muted" id="live-hint"></p></div><span class="muted" id="updated"></span></div>
      <div class="metrics live-metrics">
        <article class="metric"><span class="metric-label" data-i18n="actual"></span><div><strong id="live-actual">—</strong><span class="unit">W</span></div></article>
        <article class="metric"><span class="metric-label" data-i18n="estimated"></span><div><strong id="live-estimated">—</strong><span class="unit">W</span></div></article>
        <article class="metric secondary-metric"><span class="metric-label" data-i18n="pr"></span><div><strong id="live-pr">—</strong><span class="unit">%</span></div></article>
        <article class="metric secondary-metric"><span class="metric-label" data-i18n="opportunity"></span><div><strong id="live-opportunity">—</strong><span class="unit">W</span></div></article>
      </div>
      <article class="panel live-panel"><div class="panel-heading"><h2 data-i18n="power_chart"></h2><div class="legend"><span class="amber-dot" data-i18n="estimated"></span><span class="green-dot" data-i18n="actual"></span></div></div><div class="chart" id="live-chart"></div><p class="muted" id="live-reason"></p></article>
      <div class="live-status muted"><span id="live-quality"></span><span id="live-coverage"></span></div>
      <details id="source-diagnostics" class="panel quality-panel"><summary data-i18n="diagnostics"></summary><div class="panel-heading"><h2 data-i18n="quality"></h2><span class="muted" id="timezone-note"></span></div><div class="table-scroll"><table><thead><tr><th data-i18n="source"></th><th data-i18n="value"></th><th data-i18n="age"></th></tr></thead><tbody id="source-rows"></tbody><tbody id="source-empty"><tr><td colspan="3" class="source-empty muted" data-i18n="no_sensor_data">No sensor data yet</td></tr></tbody></table></div></details>
    </section>
    <section id="history-page" hidden>
      <div class="section-heading"><div><h1 data-i18n="statistics"></h1><p class="muted" id="statistics-hint"></p></div><select id="history-range" aria-label="History"><option value="1" data-i18n="last_24h"></option><option value="7" data-i18n="last_7d"></option><option value="30" data-i18n="last_30d"></option></select></div>
      <div class="metrics history-metrics">
        <article class="metric"><span class="metric-label" data-i18n="range_energy"></span><div><strong id="history-energy">—</strong><span class="unit">kWh</span></div></article>
        <article class="metric"><span class="metric-label" data-i18n="range_pr"></span><div><strong id="history-pr">—</strong><span class="unit">%</span></div></article>
        <article class="metric"><span class="metric-label" data-i18n="coverage"></span><div><strong id="stat-coverage">—</strong></div></article>
      </div>
      <p class="muted" id="history-boundaries"></p>
      <div class="history-grid"><article class="panel"><h3 data-i18n="power_chart"></h3><div class="chart" id="history-chart"></div></article><article class="panel"><h3 data-i18n="pr_chart"></h3><div class="chart" id="pr-chart"></div></article></div>
      <div class="inline-notes"><span id="last-settled"></span><span data-i18n="settled_hint"></span></div>
      <details class="panel totals-fold" id="history-totals"><summary data-i18n="totals"></summary><div class="fixed-totals"><div><span data-i18n="daily"></span><strong id="daily-energy">—</strong><span class="unit">kWh</span></div><div><span data-i18n="total"></span><strong id="total-energy">—</strong><span class="unit">kWh</span></div></div><p class="muted" data-i18n="totals_help"></p><p class="muted" data-i18n="energy_help"></p></details>
    </section>
    <section id="forecast-page" hidden>
      <div class="section-heading"><div><h1 data-i18n="forecast"></h1><p class="muted" data-i18n="forecast_intro"></p></div></div>
      <button class="secondary" id="open-forecast-settings" data-i18n="forecast_configure"></button>
    </section>
    <section id="configuration" hidden>
      <div class="settings-heading"><button type="button" id="settings-back"></button><h1 data-i18n="settings"></h1></div>
      <div class="settings-layout">
        <nav id="settings-categories" aria-label="Settings categories">
          <button type="button" data-settings-category="connection" aria-pressed="true" data-i18n="connection"></button>
          <button type="button" data-settings-category="panels" aria-pressed="false" data-i18n="solar"></button>
          <button type="button" data-settings-category="sources" aria-pressed="false" data-i18n="inputs"></button>
          <button type="button" data-settings-category="monitoring" aria-pressed="false" data-i18n="monitoring"></button>
          <button type="button" data-settings-category="forecast" aria-pressed="false" data-i18n="forecast"></button>
        </nav>
        <form id="settings-form" novalidate>
        <section class="form-section" data-settings-section="connection"><h2><span data-i18n="connection"></span></h2><p id="app-connection-note" class="muted" data-i18n="app_connection" hidden></p><div class="form-grid" id="connection-fields"><label><span data-i18n="ha_url"></span><input id="ha-url" type="url" placeholder="http://homeassistant.local:8123" autocomplete="url"></label><label><span data-i18n="ha_token"></span><input id="ha-token" type="password" autocomplete="new-password"><small data-i18n="token_help"></small></label></div><button type="button" class="secondary" id="load-entities" data-i18n="connect"></button><span id="connection-result" role="status"></span></section>
        <section class="form-section" data-settings-section="panels" hidden><h2><span data-i18n="solar"></span></h2><div class="form-grid"><label><span data-i18n="rated_power"></span><div class="input-unit"><input name="rated_power_w" type="number" min="1" max="1000000000" step="any" required><span>W</span></div></label><label><span data-i18n="coefficient"></span><div class="input-unit"><input name="temperature_coefficient_pct_per_c" type="number" min="-5" max="5" step="any" required><span>%/°C</span></div><small data-i18n="coef_help"></small></label></div></section>
        <section class="form-section" data-settings-section="sources" hidden><h2><span data-i18n="inputs"></span></h2><div class="form-grid three"><label><span data-i18n="power_source"></span><input name="power_entity" list="power-options" pattern="sensor\.[a-z0-9_]+" data-i18n-placeholder="select_source" required><datalist id="power-options"></datalist></label><label><span data-i18n="temp_source"></span><input name="temperature_entity" list="temperature-options" pattern="sensor\.[a-z0-9_]+" data-i18n-placeholder="select_source" required><datalist id="temperature-options"></datalist></label><label><span data-i18n="irr_source"></span><input name="irradiance_entity" list="irradiance-options" pattern="sensor\.[a-z0-9_]+" data-i18n-placeholder="select_source" required><datalist id="irradiance-options"></datalist></label></div></section>
        <section class="form-section" data-settings-section="monitoring" hidden><h2><span data-i18n="timing"></span></h2><div class="form-grid three"><label><span data-i18n="interval"></span><div class="input-unit"><select name="interval_minutes"><option>1</option><option selected>5</option><option>10</option></select><span data-i18n="minutes"></span></div></label><label><span data-i18n="realtime_window"></span><div class="input-unit"><input name="realtime_window_seconds" type="number" min="10" max="3600" value="60" required><span>s</span></div></label><label><span data-i18n="update_interval"></span><div class="input-unit"><input name="update_seconds" type="number" min="1" max="60" value="5" required><span>s</span></div></label></div>
        <details id="monitoring-advanced" class="advanced-settings"><summary data-i18n="advanced"></summary><p class="muted" data-i18n="hold_help"></p><div class="form-grid three"><label><span data-i18n="power_age"></span><input name="power_max_age_seconds" type="number" min="1" max="86400" value="300" required></label><label><span data-i18n="temp_age"></span><input name="temperature_max_age_seconds" type="number" min="1" max="86400" value="900" required></label><label><span data-i18n="irr_age"></span><input name="irradiance_max_age_seconds" type="number" min="1" max="86400" value="300" required></label></div></details></section>
        <section class="form-section" data-settings-section="forecast" hidden>
          <h2 data-i18n="forecast"></h2><p class="muted" data-i18n="forecast_help"></p>
          <p id="forecast-location" class="readonly-row muted"></p><p class="muted" data-i18n="location_help"></p>
          <div class="form-grid">
            <label class="checkbox-row"><span data-i18n="forecast_enabled"></span><input name="forecast_enabled" type="checkbox"></label>
            <label><span data-i18n="forecast_tilt"></span><div class="input-unit"><input name="forecast_tilt_deg" type="number" min="0" max="90" step="any"><span>°</span></div></label>
            <label><span data-i18n="forecast_direction"></span><select id="forecast-direction"><option value="" data-i18n="direction_unset"></option><option value="0" data-i18n="north"></option><option value="90" data-i18n="east"></option><option value="180" data-i18n="south"></option><option value="270" data-i18n="west"></option><option value="custom" data-i18n="custom"></option></select></label>
            <label id="forecast-azimuth-row" hidden><span data-i18n="forecast_azimuth"></span><div class="input-unit"><input name="forecast_azimuth_deg" type="number" min="0" step="any"><span>°</span></div><small data-i18n="azimuth_help"></small></label>
            <label><span data-i18n="forecast_noct"></span><div class="input-unit"><input name="forecast_noct_c" type="number" min="20" max="80" step="any" value="45" required><span>°C</span></div><small data-i18n="noct_help"></small></label>
          </div>
        </section>
        <div class="form-actions"><span id="save-result" role="status"></span><button type="submit" class="primary" id="save-button" data-i18n="save"></button></div>
        </form>
      </div>
    </section>
  </main>
  <footer>PVYieldLens <span class="muted">0.1.0-beta.1</span></footer>
</body>
</html>
